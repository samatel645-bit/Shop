  if (LOADING) return `<p class="pad muted" style="text-align:center">${t("load")}</p>`;
  if (!l.length) return `<p class="pad muted" style="text-align:center">${t("none")}</p>`;
  return `<div class="grid">${l.map(p => { const n = S.cart[p.id] || 0; const c = p[S.lang];
    return `<div class="card ${p.out ? "oos" : ""}" onclick="openD(${p.id})"><div class="ph">${ico(p)}</div>${p.badge ? `<span class="badge">${p.badge}</span>` : ""}<button class="fav" onclick="toggleFav(${p.id},event)">${S.fav.includes(p.id) ? "❤️" : "🤍"}</button>
    <div class="cb"><h3>${esc(c[0])}</h3>${p.r ? `<div class="star"><b>★</b> ${p.r} · ${p.n}</div>` : ""}<div><span class="price">${fmt(p.price)}</span>${p.old ? `<span class="old">${fmt(p.old)}</span>` : ""}</div>
    <div style="margin-top:auto" onclick="event.stopPropagation()">${n ? `<div class="qty"><button onclick="change(${p.id},-1)">−</button><b>${n}</b><button onclick="change(${p.id},1)">+</button></div>` : `${p.out ? `<button class="add" disabled style="width:100%">${t("oos")}</button>` : `<button class="add" style="width:100%" onclick="change(${p.id},1);toast(t('added'))">${t("add")}</button>`}`}</div></div></div>`; }).join("")}</div>`;
}
function shop() {
  const rv = S.recent.length ? `<div class="chips" style="padding:0 12px"><span class="muted" style="align-self:center;white-space:nowrap">${t("seen")}</span>${S.recent.map(id => `<button onclick="openD(${id})">${P(id).e} ${esc(P(id)[S.lang][0])}</button>`).join("")}</div>` : "";
  const name = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? ", " + esc(tg.initDataUnsafe.user.first_name) : "";
  return `<div class="top"><div class="row"><input placeholder="🔍 ${t("search")}" value="${esc(S.q)}" oninput="S.q=this.value;document.getElementById('list').innerHTML=list()">${seg()}</div>
   <div class="chips">${CATS.map(c => `<button class="${S.cat === c.id && !S.favOnly ? "on" : ""}" onclick="S.cat='${c.id}';S.favOnly=false;render()">${c.e} ${c[S.lang]}</button>`).join("")}<button class="${S.favOnly ? "on" : ""}" onclick="S.favOnly=!S.favOnly;render()">❤️ ${t("fav")}</button></div></div>
   <div class="hero"><h1>${t("hi")}${name}! 👋</h1><p>${t("sub")}</p><p style="margin-top:6px;font-weight:700">🚚 ${t("free")}</p></div>
   <div class="promos"><div onclick="go('cart')">🚚 ${t("free")}</div><div onclick="applyTop()">🏷 ${Object.keys(SHOP.promo)[0]} · −${Object.values(SHOP.promo)[0]}%<small>${t("promo")}</small></div><div onclick="S.sort='pop';S.cat='all';S.favOnly=false;render()">🔥 ${t("pop")}</div></div>${rv}
   <div class="tools"><span class="muted"></span><select onchange="S.sort=this.value;document.getElementById('list').innerHTML=list()"><option value="pop" ${S.sort === "pop" ? "selected" : ""}>${t("pop")}</option><option value="cheap" ${S.sort === "cheap" ? "selected" : ""}>${t("cheap")}</option><option value="exp" ${S.sort === "exp" ? "selected" : ""}>${t("exp")}</option></select></div>
   <div id="list">${list()}</div><p class="pad muted">${t("note")}</p>
   <div class="pad"><b>${t("ask")}</b><div class="contact"><a href="https://t.me/${SHOP.tg}">💬 ${t("write")}</a><a href="tel:${SHOP.phone}">📞 ${t("call")}</a></div></div>
   ${count() ? `<div class="bar up"><button class="cta" onclick="go('cart')"><span>🛒 ${t("cart")} · ${count()}</span><span>${fmt(goods())}</span></button></div>` : ""}`;
}
function sheet() {
  const p = P(S.detail), c = p[S.lang], n = S.cart[p.id] || 0;
  return `<div class="ov" onclick="S.detail=null;render()"><div class="sheet" onclick="event.stopPropagation()"><div class="big">${ico(p)}</div><h2 style="margin:12px 0 2px">${esc(c[0])}</h2>
   ${p.r ? `<div class="star"><b>★</b> ${p.r} · ${p.n}</div>` : ""}<p style="margin-top:6px">${esc(c[1])}</p><h3>${t("comp")}</h3><p>${esc(c[2])}</p><h3>${t("use")}</h3><p>${esc(c[3])}</p><p class="muted" style="margin-top:10px">${t("cert")}</p><button class="opt" style="width:100%;margin-top:10px;text-align:center" onclick="shareP(${p.id})">📤 ${t("share")}</button>
   <div class="row" style="margin-top:14px"><div style="flex:1"><div class="price" style="font-size:18px">${fmt(p.price)}</div>${p.old ? `<span class="old" style="margin:0">${fmt(p.old)}</span>` : ""}</div>
   <div style="flex:1.2">${n ? `<div class="qty"><button onclick="change(${p.id},-1)">−</button><b>${n}</b><button onclick="change(${p.id},1)">+</button></div>` : p.out ? `<button class="add" disabled style="width:100%;padding:13px">${t("oos")}</button>` : `<button class="add" style="width:100%;padding:13px" onclick="change(${p.id},1)">${t("add")}</button>`}</div></div></div></div>`;
}
function cart() {
  const net = goods() - disc(), left = SHOP.free - net, pct = Math.min(100, net / SHOP.free * 100);
  const cs = new Set(Object.keys(S.cart).map(id => P(id).cat));
  const rec = PRODUCTS.filter(p => !S.cart[p.id]).sort((a, b) => (cs.has(b.cat) ? 1 : 0) - (cs.has(a.cat) ? 1 : 0) || b.n - a.n).slice(0, 4);
  const cross = (net < SHOP.min ? `<p class="muted" style="color:var(--warn)">${t("minor")} ${fmt(SHOP.min)}</p>` : "") + (rec.length ? `<b>${t("also")}</b><div class="chips">${rec.map(p => `<button onclick="change(${p.id},1)">${p.e} ${esc(p[S.lang][0])} · ${fmt(p.price)} ＋</button>`).join("")}</div>` : "");
  const items = Object.entries(S.cart).map(([id, q]) => { const p = P(id); return `<div class="item"><div class="e">${ico(p)}</div><div class="m"><b>${esc(p[S.lang][0])}</b><div class="muted">${fmt(p.price)}</div></div><div class="qty"><button onclick="change(${id},-1)">−</button><b>${q}</b><button onclick="change(${id},1)">+</button></div></div>`; }).join("");
  if (!count()) return `<div class="pad"><button class="back" onclick="go('shop')">${t("back")}</button><h2>${t("cart")}</h2><p class="muted">${t("empty")}</p></div>`;
  return `<div class="pad"><button class="back" onclick="go('shop')">${t("back")}</button><h2>${t("cart")}</h2>
   <div class="prog">${left > 0 ? `${t("left")} <b>${fmt(left)}</b>` : `<b>${t("got")}</b>`}<div class="track"><i style="width:${pct}%"></i></div></div>${items}
   ${cross}<div class="promo"><input id="pc" placeholder="${t("promo")}" value="${esc(S.code)}"><button onclick="applyPromo()">${t("apply")}</button></div>
   <div class="sum"><span>${t("goods")}</span><span>${fmt(goods())}</span></div>${S.pct ? `<div class="sum" style="color:var(--brand)"><span>${t("disc")} (${S.pct}%)</span><span>−${fmt(disc())}</span></div>` : ""}</div>
   <div class="bar up"><button class="cta" onclick="go('checkout')"><span>${t("checkout")}</span><span>${fmt(net)}</span></button></div>`;
}
function checkout() {
  const d = Object.entries(DELIVERY).map(([k, v]) => `<button class="opt ${S.dl === k ? "on" : ""}" onclick="readForm();S.dl='${k}';render()">${v.e} ${v[S.lang]}<small>${v[S.lang === "uz" ? "tu" : "tr"]} · ${v.price && goods() - disc() < SHOP.free ? fmt(v.price) : "0"}</small></button>`).join("");
  const y = Object.entries(PAYMENT).map(([k, v]) => `<button class="opt ${S.pay === k ? "on" : ""}" onclick="readForm();S.pay='${k}';render()">${v.e} ${v[S.lang]}</button>`).join("");
  return `<div class="pad"><button class="back" onclick="go('cart')">${t("back")}</button><h2>${t("checkout")}</h2>
   <input id="f_name" placeholder="${t("name")}" value="${esc(S.f.name)}" autocomplete="name"><input id="f_phone" type="tel" placeholder="${t("phone")}" value="${esc(S.f.phone)}" autocomplete="tel">
   <textarea id="f_addr" rows="2" placeholder="${t("addr")}">${esc(S.f.addr)}</textarea><button class="opt ${S.loc ? "on" : ""}" onclick="getLoc()">📍 ${S.loc ? t("locok") : t("loc")}<small>${S.loc ? S.loc.lat.toFixed(5) + ", " + S.loc.lon.toFixed(5) : t("lochint")}</small></button><textarea id="f_cmt" rows="2" placeholder="${t("cmt")}">${esc(S.f.cmt)}</textarea>
   <b>${t("dl")}</b><div class="opts">${d}</div><b>${t("py")}</b><div class="opts">${y}</div>
   <div class="sum"><span>${t("goods")}</span><span>${fmt(goods() - disc())}</span></div><div class="sum"><span>${t("ship")}</span><span>${ship() ? fmt(ship()) : "0"}</span></div><div class="sum big"><span>${t("total")}</span><span>${fmt(grand())}</span></div>
   <p class="muted">${t("demo")}</p></div><div class="bar"><button class="cta" onclick="submitOrder()"><span>${t("order")}</span><span>${fmt(grand())}</span></button></div>`;
}
function getLoc() {
  readForm();
  const ok = (la, lo) => { S.loc = { lat: la, lon: lo }; buzz(); toast(t("locok")); render(); };
  const fail = () => toast(t("locerr"));
  const web = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => ok(p.coords.latitude, p.coords.longitude), fail, { enableHighAccuracy: true, timeout: 10000 }) : fail();
  const LM = tg && tg.LocationManager;
  if (LM) LM.init(() => { if (!LM.isLocationAvailable) return web(); LM.getLocation(l => l ? ok(l.latitude, l.longitude) : web()); });
  else web();
}
function submitOrder() {
  readForm();
  if (goods() - disc() < SHOP.min) { toast(t("minor") + " " + fmt(SHOP.min)); buzz("heavy"); return; }
  if (!S.f.name.trim() || !S.f.phone.trim() || (S.dl !== "pickup" && !S.f.addr.trim() && !S.loc)) { toast(t("fill")); buzz("heavy"); return; }
  const data = { lang: S.lang, name: S.f.name, phone: S.f.phone, addr: S.f.addr, comment: S.f.cmt, loc: S.loc, delivery: S.dl, payment: S.pay, promo: S.code, discount: Math.round(disc()),
    items: Object.entries(S.cart).map(([id, q]) => ({ id: +id, name: P(id).uz[0], qty: q, price: P(id).price })), goods: goods(), shipping: ship(), total: Math.round(grand()) };
  try { tg && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
  const msg = buildMsg(data);
  if (SHOP.api) { // 2-variant: bepul Cloudflare Worker orqali avtomatik yuborish
    fetch(SHOP.api, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: msg, data }) })
      .then(r => { if (!r.ok) throw 0; toast("✅ " + t("sent")); finish(data); })
      .catch(() => toast(t("err")));
    return;
  }
  // 1-variant (serversiz): egasining Telegram chati tayyor xabar bilan ochiladi
  const url = "https://t.me/" + SHOP.tg + "?text=" + encodeURIComponent(msg);
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
  finish(data);
}
function buildMsg(d) {
  const lines = d.items.map(i => "• " + i.name + " × " + i.qty + " = " + i.price * i.qty + " so'm").join("\n");
  return "🛒 Yangi buyurtma\n\n👤 " + d.name + "\n📞 " + d.phone + "\n📍 " + (d.addr || "-") + (d.loc ? "\n🗺 https://maps.google.com/?q=" + d.loc.lat + "," + d.loc.lon : "") + "\n🚚 " + DELIVERY[d.delivery].uz + "\n💳 " + PAYMENT[d.payment].uz +
    (d.comment ? "\n💬 " + d.comment : "") + "\n\n" + lines + (d.discount ? "\n🏷 Chegirma: -" + d.discount + " so'm" : "") + "\n🚚 Yetkazish: " + d.shipping + " so'm\n\n💰 Jami: " + d.total + " so'm";
}
const FAQ = [ /* do'kon egasi o'zgartiradi */
 { uz: ["Buyurtma qanday beriladi?", "Mahsulotni savatga qo'shing, ma'lumotlarni kiriting va «Buyurtma berish» ni bosing. Operator siz bilan bog'lanadi."], ru: ["Как сделать заказ?", "Добавьте товар в корзину, заполните данные и нажмите «Оформить заказ». Оператор свяжется с вами."] },
 { uz: ["Mahsulot sertifikati bormi?", "Sertifikat va ruxsatnoma ma'lumotlari so'rov bo'yicha taqdim etiladi."], ru: ["Есть ли сертификаты?", "Информация о сертификатах и разрешениях предоставляется по запросу."] },
 { uz: ["Bu dorining o'rnini bosadimi?", "Yo'q. Mahsulotlar dori vositasi emas, tabiiy qo'shimchalardir. Kasallik bo'lsa shifokorga murojaat qiling."], ru: ["Заменяет ли это лекарства?", "Нет. Товары не являются лекарственными средствами. При заболевании обратитесь к врачу."] },
 { uz: ["Yetkazish qancha vaqt oladi?", "Kuryer 1–2 kun, pochta 3–5 kun. Muddat hududga qarab o'zgarishi mumkin."], ru: ["Сколько занимает доставка?", "Курьер 1–2 дня, почта 3–5 дней. Срок может меняться в зависимости от региона."] }
];
const nm = id => (P(id) ? P(id)[S.lang][0] : "?");
function openD(id) { S.detail = id; S.recent = [id, ...S.recent.filter(x => x !== id)].slice(0, 6); store.set("recent", S.recent); render(); }
function applyTop() { const c = Object.keys(SHOP.promo)[0]; S.code = c; S.pct = SHOP.promo[c]; toast(t("okp")); buzz("medium"); render(); }
function shareP(id) { const u = "https://t.me/share/url?url=" + encodeURIComponent(SHOP.link) + "&text=" + encodeURIComponent(nm(id) + " — " + fmt(P(id).price)); if (tg && tg.openTelegramLink) tg.openTelegramLink(u); else window.open(u, "_blank"); }
function finish(d) {
  S.hist.unshift({ id: Date.now(), ts: new Date().toLocaleString(S.lang === "ru" ? "ru-RU" : "uz-UZ"), items: d.items.map(i => ({ id: i.id, qty: i.qty })), total: d.total });
  S.hist = S.hist.slice(0, 20); S.cart = {}; S.code = ""; S.pct = 0; S.view = "orders"; save(); render(); scrollTo(0, 0);
}
function repeat(id) { const o = S.hist.find(x => x.id === id); if (!o) return; S.cart = {}; o.items.forEach(i => { if (P(i.id)) S.cart[i.id] = i.qty; }); save(); buzz(); go("cart"); }
function orders() {
  if (!S.hist.length) return `<div class="pad"><h2>${t("torders")}</h2><p class="muted">${t("noord")}</p></div>`;
  return `<div class="pad"><h2>${t("torders")}</h2>${S.hist.map(o => `<div class="item" style="flex-direction:column;align-items:stretch"><div class="sum"><b>#${String(o.id).slice(-5)}</b><span class="muted">${esc(o.ts)}</span></div><div class="muted">${o.items.map(i => esc(nm(i.id)) + " ×" + i.qty).join(", ")}</div><div class="sum"><b>${fmt(o.total)}</b><button class="opt" style="width:auto;padding:8px 12px" onclick="repeat(${o.id})">🔁 ${t("again")}</button></div></div>`).join("")}</div>`;
}
function info() {
  const box = (h, body) => `<div class="item" style="flex-direction:column;align-items:stretch;gap:4px"><b>${h}</b>${body}</div>`;
  const tm = S.lang === "uz" ? "tu" : "tr";
  return `<div class="pad"><h2>${t("tinfo")}</h2>
   ${box("🕘 " + t("hours"), `<span class="muted">${esc(SHOP.hours)}</span>`)}
   ${box("🚚 " + t("ship"), Object.values(DELIVERY).map(v => `<span class="muted">${v.e} ${v[S.lang]}: ${v[tm]} · ${v.price ? fmt(v.price) : "0"}</span>`).join("") + `<span class="muted">${t("free")}</span>`)}
   ${box("💳 " + t("py"), `<span class="muted">${Object.values(PAYMENT).map(v => v[S.lang]).join(", ")}</span>`)}
   <b>${t("faq")}</b>${FAQ.map(f => `<details><summary>${esc(f[S.lang][0])}</summary><p>${esc(f[S.lang][1])}</p></details>`).join("")}
   <div class="contact"><a href="https://t.me/${SHOP.tg}">💬 ${t("write")}</a><a href="tel:${SHOP.phone}">📞 ${t("call")}</a></div><p class="muted">${t("note")}</p></div>`;
}
function tabs() {
  const items = [["shop", "🏠", t("tshop")], ["cart", "🛒", t("cart")], ["orders", "📋", t("torders")], ["info", "ℹ️", t("tinfo")]];
  return `<nav class="tabs">${items.map(([k, e, l]) => `<button class="${S.view === k ? "on" : ""}" onclick="go('${k}')"><span>${e}</span>${l}${k === "cart" && count() ? `<i>${count()}</i>` : ""}</button>`).join("")}</nav>`;
}
function render() {
  const v = S.view;
  $.innerHTML = (v === "shop" ? shop() : v === "cart" ? cart() : v === "orders" ? orders() : v === "info" ? info() : checkout()) + (S.detail ? sheet() : "") + (v !== "checkout" ? tabs() : "");
}
let LOADING = false;
const CAT_ALL = { id: "all", e: "✨", uz: "Hammasi", ru: "Все" };
const ico = p => p.img ? `<img class="pi" loading="lazy" alt="" src="${esc(p.img)}" onerror="this.remove()">` : p.e;
function parseCSV(x) { const r = []; let row = [], f = "", q = false; for (let i = 0; i < x.length; i++) { const c = x[i]; if (q) { if (c === '"') { if (x[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; } else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; } else if (c === "\n") { row.push(f); r.push(row); row = []; f = ""; } else if (c !== "\r") f += c; } if (f !== "" || row.length) { row.push(f); r.push(row); } return r; }
function fromSheet(rows) {
  const h = rows[0].map(x => x.trim().toLowerCase()), out = [], cats = new Map(), num = v => parseInt(String(v || "").replace(/\D/g, "")) || 0;
  rows.slice(1).forEach(r => {
    const o = {}; h.forEach((k, i) => o[k] = (r[i] || "").trim());
    const id = parseInt(o.id), st = (o.holat || "bor").toLowerCase();
    if (!id || !o.nom_uz || st.startsWith("yash")) return;
    const price = num(o.narx), old = num(o.eski_narx), cid = "c_" + (o.kategoriya_uz || "boshqa").toLowerCase();
    cats.set(cid, { id: cid, e: "", uz: o.kategoriya_uz || "Boshqa", ru: o.kategoriya_ru || o.kategoriya_uz || "Другое" });
    out.push({ id, cat: cid, e: o.emoji || "🌿", img: o.rasm, price, old: old > price ? old : 0, badge: o.belgi, out: st.startsWith("tug"), r: parseFloat(o.reyting) || 0, n: num(o.sharhlar),
      uz: [o.nom_uz, o.tavsif_uz, o.tarkib_uz, o.qollash_uz], ru: [o.nom_ru || o.nom_uz, o.tavsif_ru || o.tavsif_uz, o.tarkib_ru || o.tarkib_uz, o.qollash_ru || o.qollash_uz] });
  });
  return { products: out, cats: [CAT_ALL, ...cats.values()] };
}
function applyCatalog(c) {
  PRODUCTS = c.products; CATS = c.cats;
  Object.keys(S.cart).forEach(id => { const p = P(id); if (!p || p.out) delete S.cart[id]; });
  S.recent = S.recent.filter(id => P(id)); S.fav = S.fav.filter(id => P(id));
  if (!CATS.some(x => x.id === S.cat)) S.cat = "all";
  save();
}
async function loadCatalog() {
  if (!SHOP.sheet) { render(); return; }
  const cached = store.get("catalog", null);
  if (cached) applyCatalog(cached); else { PRODUCTS = []; CATS = [CAT_ALL]; LOADING = true; S.cart = {}; }
  render();
  try {
    const r = await fetch(SHOP.sheet + (SHOP.sheet.includes("?") ? "&" : "?") + "_=" + Date.now());
    if (!r.ok) throw 0;
    const c = fromSheet(parseCSV(await r.text()));
    if (c.products.length) { store.set("catalog", c); applyCatalog(c); }
  } catch (e) { if (!cached) toast(t("err")); }
  LOADING = false; render();
}
loadCatalog();
</script>
